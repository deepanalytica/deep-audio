name: Web Studio Check
on:
  push:
    branches: [feature/immersive-studio-v2, main]
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check web/studio-v2.js
      - name: Static file integrity
        shell: bash
        run: |
          test -s web/index.html
          test -s web/studio-v2.css
          test -s web/studio-v2.js
          grep -q 'id="studio"' web/index.html
          grep -q 'studio-v2.js?v=20260920-2' web/index.html
          grep -q "./vendor/three.module.js" web/studio-v2.js\n          test -s web/vendor/three.module.js
          grep -q "SESSION PLAYERS" web/studio-v2.js
          grep -q "HARMONY LAB" web/studio-v2.js
