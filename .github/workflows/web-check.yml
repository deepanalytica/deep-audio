name: Web Studio Check
on:
  push:
    branches: [main, feature/studio-v3-r3f]
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Validate output
        shell: bash
        run: |
          test -s web/dist/index.html
          test -d web/dist/assets
          grep -q "Deep Music Producer" web/dist/index.html
