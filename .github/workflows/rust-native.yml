name: Rust Native Platform

on:
  push:
    branches: [main, rust-native-platform]
    paths:
      - "native/**"
      - "web/**"
      - ".github/workflows/rust-native.yml"
  pull_request:
    paths:
      - "native/**"
      - "web/**"
      - ".github/workflows/rust-native.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Test core default members
        run: cargo test
      - name: Clippy core default members
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Deep Glue CLAP
        run: cargo check -p deep-glue-clap

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build immersive web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Check Tauri shell
        working-directory: native
        run: cargo check -p deep-music-producer-native
      - name: Check WASAPI/CPAL audio proof
        working-directory: native
        run: cargo check -p deep-audio-lab --features native-audio
