name: Rust Native Platform

concurrency:
  group: rust-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, rust-native-platform]
    paths:
      - "native/**"
      - "web/**"
      - ".github/workflows/rust-native.yml"
  pull_request:
    paths:
      - "native/**"
      - "web/**"
      - ".github/workflows/rust-native.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test core default members
        run: cargo test
      - name: Clippy core default members
        run: cargo clippy --all-targets -- -D warnings
      - name: Check Deep Glue CLAP
        run: cargo check -p deep-glue-clap

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build immersive web frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Check Tauri shell with native audio
        working-directory: native
        run: cargo check -p deep-music-producer-native --features native-audio
      - name: Check WASAPI/CPAL audio proof
        working-directory: native
        run: cargo check -p deep-audio-lab --features native-audio

  windows-artifact:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/rust-native-platform') ||
      (github.event_name == 'pull_request' && github.head_ref == 'rust-native-platform')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build immersive frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Deep Music Producer release executable
        working-directory: native
        run: cargo build -p deep-music-producer-native --features native-audio --release
      - name: Build Deep Glue CLAP release plugin
        working-directory: native
        run: cargo build -p deep-glue-clap --release
      - name: Verify release binaries
        shell: pwsh
        run: |
          if (!(Test-Path "native/target/release/deep-music-producer-native.exe")) { throw "Deep Music Producer executable missing" }
          if (!(Test-Path "native/target/release/deep_glue_clap.dll")) { throw "Deep Glue CLAP binary missing" }
          if ((Get-Item "native/target/release/deep-music-producer-native.exe").Length -le 0) { throw "Deep Music Producer executable is empty" }
          if ((Get-Item "native/target/release/deep_glue_clap.dll").Length -le 0) { throw "Deep Glue CLAP binary is empty" }
      - name: Package Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item native/target/release/deep-music-producer-native.exe dist/DeepMusicProducer.exe
          Copy-Item native/target/release/deep_glue_clap.dll dist/DeepGlue.clap
          Copy-Item docs/RUST_NATIVE_PLATFORM.md dist/ARCHITECTURE.md
          @(
            "Deep Music Producer Windows x64"
            "commit=${{ github.sha }}"
            "built_utc=$((Get-Date).ToUniversalTime().ToString('o'))"
          ) | Set-Content dist/BUILD.txt
          (Get-FileHash dist/DeepMusicProducer.exe -Algorithm SHA256).Hash + "  DeepMusicProducer.exe" | Set-Content dist/SHA256SUMS.txt
          (Get-FileHash dist/DeepGlue.clap -Algorithm SHA256).Hash + "  DeepGlue.clap" | Add-Content dist/SHA256SUMS.txt
          Compress-Archive -Path dist/* -DestinationPath DeepMusicProducer-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DeepMusicProducer-Windows-x64-${{ github.sha }}
          path: DeepMusicProducer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
