name: Deep Audio Convert APK

on:
  push:
    branches: ["build/audio-converter-apk-20260929"]
    paths:
      - "converter/**"
      - "settings.gradle.kts"
      - ".github/workflows/converter-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar" || "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build signed universal release APK
        run: gradle :converter:assembleRelease --stacktrace

      - name: Verify APK signatures
        run: |
          APK="converter/build/outputs/apk/release/converter-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          cp "$APK" DeepAudioConvert-1.0.1.apk
          ls -lh DeepAudioConvert-1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepAudioConvert-1.0.1-APK
          path: DeepAudioConvert-1.0.1.apk
          if-no-files-found: error
          retention-days: 7
