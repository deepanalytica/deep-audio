name: Patron Cero - Voz TTS gratuita
on:
  push:
    branches: [feature/patron-cero-tts]
    paths:
      - 'patron-cero-tts/**'
      - '.github/workflows/voz-kokoro.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'Nombre del archivo de patron-cero-tts/jobs (sin extension)'
        required: true
        default: 'prueba_patron_cero'
      voice:
        description: 'Voz: em_alex, em_santa o ef_dora'
        required: true
        default: 'em_alex'
permissions:
  contents: read
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg libsndfile1
          python -m pip install --upgrade pip
          pip install -r patron-cero-tts/engine/requirements.txt
      - name: Seleccionar entrada
        id: input
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JOB: ${{ inputs.job }}
          EVENT_VOICE: ${{ inputs.voice }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          dispatch = os.environ['EVENT_NAME'] == 'workflow_dispatch'
          job = (os.environ.get('EVENT_JOB') or 'prueba_patron_cero') if dispatch else 'prueba_patron_cero'
          voice = (os.environ.get('EVENT_VOICE') or 'em_alex') if dispatch else 'em_alex'
          assert re.fullmatch(r'[A-Za-z0-9_-]+', job), 'Nombre inválido'
          assert voice in ('em_alex','em_santa','ef_dora'), 'Voz no válida'
          assert Path(f'patron-cero-tts/jobs/{job}.txt').is_file(), 'Falta texto de entrada'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'job={job}\nvoice={voice}\n')
          PY
      - name: Generar locucion
        run: |
          python patron-cero-tts/engine/generate.py \
            --input patron-cero-tts/jobs/${{ steps.input.outputs.job }}.txt \
            --output-dir patron-cero-tts/salida \
            --voice '${{ steps.input.outputs.voice }}' \
            --speed 0.94
      - name: Entregar MP3 y WAV
        uses: actions/upload-artifact@v4
        with:
          name: voz-${{ steps.input.outputs.job }}-${{ steps.input.outputs.voice }}
          path: patron-cero-tts/salida/*
          retention-days: 7
