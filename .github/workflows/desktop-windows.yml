name: Desktop Windows
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/desktop-studio-foundation, feature/immersive-studio-product]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S desktop -B desktop/build -A x64
      - name: Build
        run: cmake --build desktop/build --config Release --parallel
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: deep-music-producer-windows
          path: desktop/build/DeepAudioStudio_artefacts/Release/**
          if-no-files-found: error
