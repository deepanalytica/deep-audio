name: Publish Web Demo

on:
  push:
    branches: [rust-native-platform]
    paths:
      - "web/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-music-web-demo
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build demo
        working-directory: web
        run: npm run build

      - name: Validate demo output
        shell: bash
        run: |
          test -s web/dist/index.html
          test -d web/dist/assets
          grep -q "Deep Music Producer" web/dist/index.html
          touch web/dist/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web/dist
          force_orphan: true
          commit_message: "Publish Deep Music Producer web demo from ${{ github.sha }}"

      - name: Verify public demo
        shell: bash
        run: |
          url="https://deepanalytica.github.io/deep-audio/"
          for attempt in {1..18}; do
            if body="$(curl -fsSL --max-time 15 "$url" 2>/dev/null)" && grep -q "Deep Music Producer" <<<"$body"; then
              echo "Public demo verified: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Public demo did not become reachable at $url"
          exit 1
